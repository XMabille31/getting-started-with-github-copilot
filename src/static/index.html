<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Activités disponibles</h3>
        <div id="activities-list">
          <!-- Les activités seront chargées ici -->
          <p>Chargement des activités...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Inscription à une activité</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Email étudiant :</label>
            <input type="email" id="email" required placeholder="votre-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Sélectionnez une activité :</label>
            <select id="activity" required>
              <option value="">-- Sélectionnez une activité --</option>
              <!-- Les options d'activité seront chargées ici -->
            </select>
          </div>
          <button type="submit">S'inscrire</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
